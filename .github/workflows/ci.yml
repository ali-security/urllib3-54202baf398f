name: CI

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Check packages
        # Registry time machine pinned to the release date so twine/rstcheck
        # resolve to the versions that were current then. setuptools and wheel
        # are pinned explicitly rather than left to the index: the runner image
        # preinstalls a present-day setuptools that plain `pip install
        # setuptools` will not downgrade, and that one crashes egg_info with
        # `canonicalize_version() got an unexpected keyword argument
        # 'strip_trailing_zero'` against the era-appropriate `packaging`.
        # 60.9.3 was the newest setuptools on 2022-03-16; wheel 0.37.1 gives
        # the published `Generator: bdist_wheel (0.37.1)`.
        env:
          PIP_INDEX_URL: https://:2022-03-16@time-machines-pypi.sealsecurity.io/
        run: |
          python -m pip install pip "setuptools==60.9.3" "wheel==0.37.1" twine rstcheck;
          python setup.py sdist bdist_wheel;
          rstcheck README.rst CHANGES.rst
          python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
  test:
    env:
      SETUPTOOLS_USE_DISTUTILS: stdlib
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10']
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    name: ${{ fromJson('{"macos-latest":"macOS","windows-latest":"Windows","ubuntu-latest":"Ubuntu"}')[matrix.os] }} ${{ matrix.python-version }}
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python - ${{ matrix.python-version }}
        # actions/setup-python cannot provision CPython 3.10 on arm64 macOS;
        # this drop-in resolves a prebuilt build or compiles from source.
        uses: MatteoH2O1999/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache-build: true
          allow-build: allow

      - name: Install Dependencies
        run: python -m pip install --upgrade pip setuptools nox

      - name: Run Tests
        run: ./ci/run_tests.sh
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          NOX_SESSION: ''
          # Freeze the test dependency graph. 2022-07-15 rather than the release
          # date because atomicwrites (a pytest 6.2.4 win32 dep) had its whole
          # file history re-uploaded to PyPI on 2022-07-09, and because
          # setup-python's macOS 3.10 needs cryptography's universal2 wheel
          # (first shipped in cryptography 35.0.0). pyOpenSSL 22.0.0 /
          # cryptography 37.0.4 at this date do not emit the extra
          # `X509.get_subject is deprecated` warning that breaks
          # test/contrib/test_pyopenssl.py on a present-day graph.
          PIP_INDEX_URL: https://:2022-07-15@time-machines-pypi.sealsecurity.io/

  coverage:
    # Disabled: `--fail-under=100` cannot be met from the reduced interpreter
    # matrix, and no artifact or test execution depends on this job.
    if: false
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Use latest Python so it understands all syntax
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install coverage
        run: python -m pip install --upgrade coverage

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          name: coverage-data

      - name: Combine & check coverage
        run: |
          python -m coverage combine
          python -m coverage html --skip-covered --skip-empty
          python -m coverage report --ignore-errors --show-missing --fail-under=100

      - name: Upload report if check failed
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov
        if: ${{ failure() }}
